name: CI

on:
  push:
    branches: [main]
    # Release tags. Without this a `v0.1.0` push would not run CI at all, so no
    # semver-tagged image would ever reach GHCR — and the in-app update check
    # looks for exactly those tags.
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck + lint + test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kingsmaker
          POSTGRES_PASSWORD: kingsmaker
          POSTGRES_DB: kingsmaker
        ports:
          - 5544:5432
        options: >-
          --health-cmd "pg_isready -U kingsmaker -d kingsmaker"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # The suites create/drop their own test databases off this connection.
      DATABASE_URL: postgresql://kingsmaker:kingsmaker@localhost:5544/kingsmaker
      TEST_DATABASE_URL: postgresql://kingsmaker:kingsmaker@localhost:5544/kingsmaker_test
      # integrationSettings.test.ts encrypts a token, and crypto.ts refuses to do
      # that under the published `dev-secret-change-me` placeholder. A local
      # checkout picks a key up from the root `.env`, which does not exist here —
      # so without this the suite passes on a laptop and fails on CI. Throwaway
      # 64-char hex; it encrypts nothing that outlives the job.
      INTEGRATION_ENCRYPTION_KEY: c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - run: bun install --frozen-lockfile

      - run: bun run typecheck

      - run: bun run check

      # Validates the migration snapshots + detects duplicate journal ids. ~1s.
      - run: bun run db:check

      # Cheap here, and it fails the `check` job with a clear message instead of
      # surfacing 10 minutes later as an opaque image-build failure. The image
      # runs the same probe against the files it actually copied — that is the
      # assertion that matters; this one is just a fast signal.
      - run: bun run check:imports

      # Includes server/migrations.test.ts, which drives the real `drizzle-kit`
      # deploy path against an empty scratch database and asserts completeness,
      # idempotency, journal monotonicity, and schema drift. The rest of the suite
      # applies the raw .sql itself and so cannot catch ledger regressions.
      - run: bun run test

  image:
    name: build + verify image
    runs-on: ubuntu-latest
    needs: check
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        # Skipped on PRs from forks, which have no package-write token.
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # `0.1.0` and `0.1` come from a `v0.1.0` tag. The bare semver tag is
          # what server/version.ts scans the registry for — it ignores `latest`,
          # `main` and `sha-…`, so a release MUST produce one of these.
          #
          # `latest` deliberately follows RELEASE TAGS, not main: a self-hoster
          # pulling `latest` should get the newest release, not the newest commit.
          # Main pushes get `main` + `sha-…` for internal use.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=long
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}

      # Build and load locally first so the smoke test runs against the exact
      # image that gets pushed.
      # Stamps the build so /api/version can report it. On a tag push that's the
      # tag (`v0.1.0` -> `0.1.0`); otherwise `dev`, which the server treats as
      # "never claim an update is available".
      - id: version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: kingsmaker:ci
          build-args: |
            KINGSMAKER_VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A pushed image that can't migrate an empty database or serve a request is
      # worse than no image: `docker compose run app migrate` is the one step a
      # new deploy cannot skip, and drizzle-kit has exited 0 having applied
      # nothing before. Verify both before publishing.
      - name: Smoke test — migrate an empty DB, then serve
        run: |
          set -euo pipefail
          docker network create ci-net
          docker run -d --name ci-pg --network ci-net \
            -e POSTGRES_USER=kingsmaker -e POSTGRES_PASSWORD=ci \
            -e POSTGRES_DB=kingsmaker postgres:16-alpine
          for _ in $(seq 1 40); do
            docker exec ci-pg pg_isready -U kingsmaker -d kingsmaker && break
            sleep 2
          done

          DB="postgresql://kingsmaker:ci@ci-pg:5432/kingsmaker"

          echo "::group::migrate"
          docker run --rm --network ci-net -e DATABASE_URL="$DB" kingsmaker:ci migrate
          echo "::endgroup::"

          # Assert against the DATABASE, not the migrate exit code: the bug this
          # guards against exited 0 while applying nothing. With one migration set
          # the ledger count no longer distinguishes which half landed, so probe
          # both an auth table and an engine table directly.
          rows=$(docker exec ci-pg psql -U kingsmaker -d kingsmaker -tAc \
            "select count(*) from drizzle.__drizzle_migrations")
          bauth=$(docker exec ci-pg psql -U kingsmaker -d kingsmaker -tAc \
            "select count(*) from information_schema.tables where table_schema='public' and table_name='bauth_user'")
          events=$(docker exec ci-pg psql -U kingsmaker -d kingsmaker -tAc \
            "select count(*) from information_schema.tables where table_schema='public' and table_name='events'")
          expected=$(jq '.entries | length' app/db/migrations/meta/_journal.json)
          echo "ledger=$rows/$expected bauth_user=$bauth events=$events"
          test "$rows" = "$expected"
          test "$bauth" = "1"
          test "$events" = "1"

          docker run -d --name ci-app --network ci-net -p 3100:3100 \
            -e DATABASE_URL="$DB" \
            -e BETTER_AUTH_SECRET=ci-secret-not-for-real-use-000000 \
            -e BETTER_AUTH_URL=http://localhost:3100 \
            kingsmaker:ci

          # -s without -S: connection-refused retries while the server boots are
          # expected, so don't print them. The `if` keeps `set -e` from aborting.
          for _ in $(seq 1 30); do
            if curl -fs http://localhost:3100/api/health 2>/dev/null | grep -q '"ok":true'; then
              ok=1; break
            fi
            sleep 2
          done
          if [ "${ok:-0}" != "1" ]; then
            echo "health check never went green"; docker logs ci-app; exit 1
          fi

          # The SPA must be present and its hashed asset resolvable — a missing
          # `vite build` or a mis-copied dist would still pass /api/health.
          curl -fsS http://localhost:3100/ -o /tmp/index.html
          asset=$(grep -oE '/assets/index-[A-Za-z0-9_-]+\.js' /tmp/index.html | head -1)
          test -n "$asset"
          curl -fsS "http://localhost:3100$asset" -o /dev/null

          # Drive BetterAuth against the auth tables the ledger bug used to omit
          # entirely. This used to POST sign-up and assert 200, which stopped being
          # true when self-serve sign-up was closed (`disableSignUp`) — the smoke
          # test then failed on correct behaviour.
          #
          # Sign IN as a user who does not exist instead. A 401
          # INVALID_EMAIL_OR_PASSWORD proves the lookup REACHED `bauth_user` and
          # found nothing; a missing table 500s, which is the failure being
          # guarded. Asserting the code (not just the status) also means the test
          # notices if this endpoint ever gets disabled too, rather than passing on
          # some other 401.
          body=$(curl -s -o /tmp/signin.json -w '%{http_code}' -X POST \
            http://localhost:3100/api/auth/sign-in/email \
            -H 'Content-Type: application/json' \
            -H 'Origin: http://localhost:3100' \
            -d '{"email":"ci-nobody@test.dev","password":"password12345"}')
          echo "sign-in status=$body body=$(cat /tmp/signin.json)"
          test "$body" = "401"
          grep -q 'INVALID_EMAIL_OR_PASSWORD' /tmp/signin.json

          # Sign-up MUST be refused: an image that lets anyone create an account
          # is the single worst default for a self-hosted deploy, and it regressed
          # once already.
          code=$(curl -s -o /tmp/signup.json -w '%{http_code}' -X POST \
            http://localhost:3100/api/auth/sign-up/email \
            -H 'Content-Type: application/json' \
            -H 'Origin: http://localhost:3100' \
            -d '{"email":"ci@test.dev","password":"password12345","name":"CI"}')
          echo "sign-up status=$code body=$(cat /tmp/signup.json)"
          test "$code" != "200"

          echo "smoke test passed"

      - name: Tear down smoke-test containers
        if: always()
        run: |
          docker rm -f ci-app ci-pg 2>/dev/null || true
          docker network rm ci-net 2>/dev/null || true

      - name: Push image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            KINGSMAKER_VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
