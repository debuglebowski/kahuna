name: Publish CLI

# Its OWN workflow, not a job in ci.yml, and that is a security decision: npm's
# trusted publisher is bound to a workflow FILENAME. Anything in that file can
# publish as this package. Keeping it small and single-purpose means a change to
# the test pipeline can never become a change to the thing that publishes.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Pack and verify, but do not publish"
        type: boolean
        default: true

permissions:
  contents: read
  # The whole point: npm mints a short-lived credential from this OIDC token, so
  # there is no npm token in the repository to leak or rotate.
  id-token: write

jobs:
  publish:
    name: publish @kingsmaker/cli
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      # Trusted publishing needs npm >= 11.5.1 on Node >= 22.14.0. Pinning the
      # Node major and then upgrading npm explicitly, because the npm that ships
      # with a Node release is frequently older than that floor — and the failure
      # is a confusing auth error rather than a version complaint.
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          registry-url: "https://registry.npmjs.org"

      - name: Ensure npm supports OIDC
        run: |
          set -eux
          npm install -g npm@latest
          npm --version
          node --version

      - run: bun install --frozen-lockfile

      # THE MANIFESTS ARE THE SOURCE OF THE VERSION, not the tag. Every package
      # in the repo carries the same number (`bun run version:set`), and this
      # only checks that the tag agrees. Stamping from the tag instead would
      # mean the source that built an artifact never records what it built —
      # `git show v0.1.0:packages/cli/package.json` would say 0.0.0.
      - name: The tag must match the manifests
        run: |
          set -eux
          bun run version:check
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            ACTUAL="$(node -p "require('./packages/cli/package.json').version")"
            if [ "$VERSION" != "$ACTUAL" ]; then
              echo "tag v$VERSION does not match the manifests ($ACTUAL)." >&2
              echo "Run: bun run version:set $VERSION && git commit -am 'release $VERSION'" >&2
              exit 1
            fi
          fi

      # THIS WORKFLOW DOES NOT WAIT FOR ci.yml. GitHub runs them in parallel on a
      # tag push, so without these, a tag with failing tests would still publish
      # — and an npm version is permanent.
      #
      # Only the fast, database-free checks: typecheck covers all three packages
      # (so a contract change that breaks the CLI fails here), and the CLI's own
      # suite needs no Postgres. The app's suite stays in ci.yml, which gates the
      # image; duplicating its service container here would double every release
      # for a suite that cannot tell us anything new about this artifact.
      - run: bun run typecheck
      - run: bun run --cwd packages/cli test

      - run: bun run cli:build

      # The same two checks CI runs, repeated here because THIS is the artifact
      # that reaches other people: it must run under plain Node, and it must work
      # through the bin symlink an install creates.
      - name: Verify the bundle
        run: |
          set -eux
          node packages/cli/dist/index.js help | grep -q "Kingsmaker command line"
          npm pack --workspace @kingsmaker/cli --pack-destination /tmp
          mkdir -p /tmp/km-verify && cd /tmp/km-verify
          npm init -y >/dev/null
          npm install /tmp/kingsmaker-cli-*.tgz
          ./node_modules/.bin/km help | grep -q "Kingsmaker command line"
          # `cli update` is the one command that inspects its own install path,
          # so it must be reachable in the BUNDLE and not just in source. No
          # network: what it reports depends on what is published, and the
          # version being packed here is never older than that, so asserting on
          # the outcome would gate releases on registry weather. Which install
          # layout maps to which package manager is covered by selfupdate.test.ts
          # against real directory trees.
          ./node_modules/.bin/km cli update --help | grep -q "cli update"

      - name: Publish
        if: github.event_name == 'push' || inputs.dry-run == false
        run: npm publish --workspace @kingsmaker/cli
        # No NODE_AUTH_TOKEN: the OIDC token above IS the credential. Provenance
        # is attached automatically for a public repository and public package.
