# LOCAL DEVELOPMENT ONLY: trivial credentials, loopback-bound. For a real deploy use docker-compose.prod.yml.
services:
  postgres:
    image: postgres:16-alpine
    container_name: kahuna-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kahuna
      POSTGRES_PASSWORD: kahuna
      POSTGRES_DB: kahuna
    ports:
      - "127.0.0.1:5544:5432"
    volumes:
      - kahuna_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kahuna -d kahuna"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  kahuna_pgdata:
