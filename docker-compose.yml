services:
  postgres:
    image: postgres:16-alpine
    container_name: kingsmaker-postgres
    environment:
      POSTGRES_USER: kingsmaker
      POSTGRES_PASSWORD: kingsmaker
      POSTGRES_DB: kingsmaker
    ports:
      - "5544:5432"
    volumes:
      - kingsmaker_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kingsmaker -d kingsmaker"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  kingsmaker_pgdata:
